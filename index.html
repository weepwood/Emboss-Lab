    .poster::after {content:""; position:absolute; z-index:3; inset:0; pointer-events:none; background:radial-gradient(circle var(--light-size) at var(--mouse-x, 72%) var(--mouse-y, 12%),rgba(255,255,255,.28),rgba(255,255,255,.055) 48%,transparent 82%); opacity:var(--light-opacity); mix-blend-mode:soft-light; transition:opacity .2s, --mouse-x .2s;}

    .poster-index {position:absolute; z-index:4; left:16px; bottom:14px; color:rgba(255,255,255,.12); font:500 9px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.08em; pointer-events:none;}

    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important;}
    }

              <h2 class="setting-heading" id="materialHeading">材质调整</h2>
              <button type="button" class="reset" id="resetButton">恢复默认</button>
            </div>
            <div class="preset-row" role="group" aria-label="材质预设">
              <button type="button" class="preset" data-preset="soft" aria-pressed="false">柔和</button>
              <button type="button" class="preset is-active" data-preset="standard" aria-pressed="true">标准</button>
              <button type="button" class="preset" data-preset="sharp" aria-pressed="false">锐利</button>
            </div>
            <details class="panel-sub" open>
              <summary class="sub-kicker">压印</summary>
              <div class="sub-body">
              <label class="setting">浮雕深度 <output class="setting-value" id="depthValue">65%</output><input type="range" id="depthSlider" min="0" max="100" value="65" /></label>
              <label class="setting">边缘柔度 <output class="setting-value" id="blurValue">33%</output><input type="range" id="blurSlider" min="0" max="100" value="33" /></label>
              <label class="setting">颗粒密度 <output class="setting-value" id="grainValue">47%</output><input type="range" id="grainSlider" min="0" max="100" value="47" /></label>
              <label class="setting">颗粒尺寸 <output class="setting-value" id="grainSizeValue">50%</output><input type="range" id="grainSizeSlider" min="20" max="100" value="50" /></label>
              </div>
            </details>
            <details class="panel-sub" open>
              <summary class="sub-kicker">光照</summary>
              <div class="sub-body">
              <label class="setting">漫反射强度 <output class="setting-value" id="lightValue">58%</output><input type="range" id="lightSlider" min="0" max="100" value="58" /></label>
              <label class="setting">光斑半径 <output class="setting-value" id="lightSizeValue">50%</output><input type="range" id="lightSizeSlider" min="10" max="100" value="50" /></label>
              <label class="toggle-row"><span>跟随指针</span><input type="checkbox" id="followPointer" checked /><span class="toggle-track" aria-hidden="true"><span class="toggle-dot"></span></span></label>
              <div class="manual-light" id="manualLight" hidden>
                <label class="setting">光源水平 <output class="setting-value" id="lightXValue">72%</output><input type="range" id="lightXSlider" min="0" max="100" value="72" /></label>
                <label class="setting">光源垂直 <output class="setting-value" id="lightYValue">12%</output><input type="range" id="lightYSlider" min="0" max="100" value="12" /></label>
                </div>
              </div>
            </details>
            <details class="panel-sub">
              <summary class="sub-kicker">着色</summary>
              <div class="sub-body">
              <div class="setting color-setting"><span>纸面着色</span><input type="color" id="tintColor" value="#d9c6ff" aria-label="纸面着色颜色" /></div>
              <label class="setting">着色强度 <output class="setting-value" id="tintValue">0%</output><input type="range" id="tintSlider" min="0" max="100" value="0" /></label>
              <label class="setting"><span>混合模式</span><select id="tintBlend" aria-label="着色混合模式">
                <option value="soft-light" selected>柔光</option>
                <option value="overlay">叠加</option>
                <option value="multiply">正片叠底</option>
                <option value="screen">滤色</option>
              </select></label>
              </div>
            </details>
            <details class="panel-sub">
              <summary class="sub-kicker">画面</summary>
              <div class="sub-body">
              <label class="setting">画面缩放 <output class="setting-value" id="scaleValue">100%</output><input type="range" id="scaleSlider" min="90" max="115" value="100" /></label>
              <label class="setting">边缘暗角 <output class="setting-value" id="vignetteValue">0%</output><input type="range" id="vignetteSlider" min="0" max="100" value="0" /></label>
              <label class="setting">画面亮度 <output class="setting-value" id="brightnessValue">100%</output><input type="range" id="brightnessSlider" min="60" max="140" value="100" /></label>
              <label class="setting">画面对比 <output class="setting-value" id="contrastValue">100%</output><input type="range" id="contrastSlider" min="60" max="140" value="100" /></label>
              <label class="setting">画面饱和 <output class="setting-value" id="saturationValue">100%</output><input type="range" id="saturationSlider" min="0" max="170" value="100" /></label>
              </div>
            </details>
          </section>
          </div>
          <section class="sidebar-actions" aria-labelledby="actionsHeading">
            <div class="sidebar-actions-head"><h2 class="setting-heading" id="actionsHeading">快捷操作</h2><span>自动保存</span></div>
            <div class="action-grid">
              <button class="action-button" type="button" id="shuffleButton" aria-label="随机切换海报" title="随机切换（R）">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M2 18h4c5 0 7-12 12-12h4m-4-4 4 4-4 4M2 6h4c2.1 0 3.7 2 5 4M14 16c1 1.3 2.3 2 4 2h4"/></svg>
                <span>随机切换</span>
              </button>
              <button class="action-button" type="button" id="themeButton" aria-label="切换深色主题" aria-pressed="false" title="切换明暗主题（T）">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg>
                <span>明暗主题</span>
              </button>
              <button class="action-button" type="button" id="fullscreenButton" aria-label="进入沉浸模式" aria-pressed="false" title="沉浸模式（F）">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
                <span>沉浸模式</span>
              </button>
            </div>
            <div class="action-grid action-grid--two">
              <button class="action-button" type="button" id="copyLinkButton" aria-label="复制包含当前设置的链接" title="复制当前作品与参数的链接">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
                <span>复制链接</span>
              </button>
              <button class="action-button" type="button" id="exportButton" aria-label="导出当前海报为 PNG 图片" title="导出 PNG">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                <span>导出图片</span>
              </button>
            </div>
            <p class="panel-note" id="actionNote" role="status" aria-live="polite">调整实时生效，并保存在当前浏览器。</p>
          </section>
        </aside>
      </div>
    </main>
    <div class="shortcut-panel" id="shortcutPanel" hidden>
      <p class="shortcut-title">快捷键</p>
      <dl class="shortcut-list">
        <div><dt><span class="keycap">←</span><span class="keycap">→</span></dt><dd>切换作品</dd></div>
        <div><dt><span class="keycap">1</span>–<span class="keycap">5</span></dt><dd>快速选择</dd></div>
        <div><dt><span class="keycap">R</span></dt><dd>随机切换</dd></div>
        <div><dt><span class="keycap">T</span></dt><dd>明暗主题</dd></div>
        <div><dt><span class="keycap">F</span></dt><dd>沉浸模式</dd></div>
        <div><dt><span class="keycap">Esc</span></dt><dd>退出沉浸</dd></div>
      </dl>
    </div>
    <button type="button" class="exit-full" id="exitFullscreenButton" aria-label="退出沉浸模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg> 退出沉浸 (Esc)</button>
  </div>
  <script>
    (() => {
      'use strict';
      const poster = document.getElementById('poster');
      const tabs = [...document.querySelectorAll('.scene-select')];
      const scenes = [...document.querySelectorAll('.scene')];
      const count = document.getElementById('sceneCount');
      const descriptions = [
        '黄昏紫金纸张上的 ADSTRONAUT 压印海报',
        '深绿色纸张上的 EDGERUN INDUSTRIES 凹刻海报',
        '丁香紫背景上的轨道示意和工业口号海报',
        '灰色纸张上的几何徽章与机械装置海报',
        '电光紫背景上的 ADSTRONAUT 技术仪表海报'
      ];
      const sceneNames = ['黄昏紫金', '深林绿', '丁香紫', '石墨灰', '电光紫'];
      const themeButton = document.getElementById('themeButton');
      let savedTheme = 'light';
      try { savedTheme = localStorage.getItem('emboss-lab-theme') === 'dark' ? 'dark' : 'light'; } catch (_) {}
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeButton.setAttribute('aria-pressed', String(theme === 'dark'));
        themeButton.setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题');
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161a18' : '#f4f4f0';
        try { localStorage.setItem('emboss-lab-theme', theme); } catch (_) {}
      }
      setTheme(savedTheme);
      themeButton.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      let current = 0;
      function selectScene(index) {
        current = (index + scenes.length) % scenes.length;
        poster.dataset.scene = String(current);
        poster.setAttribute('aria-label', descriptions[current]);
        scenes.forEach((el, i) => {
          el.classList.toggle('is-active', i === current);
          el.setAttribute('aria-hidden', String(i !== current));
        });
        tabs.forEach((el, i) => {
          el.setAttribute('aria-selected', String(i === current));
          el.tabIndex = i === current ? 0 : -1;
        });
        count.textContent = String(current + 1).padStart(2,'0') + ' / 05';
        document.getElementById('activeSceneName').textContent = sceneNames[current];
      }
      tabs.forEach((button, i) => {
        button.addEventListener('click', () => selectScene(i));
        button.addEventListener('keydown', event => {
          let next;
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = i + 1;
          if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = i - 1;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          if (next === undefined) return;
          event.preventDefault();
          event.stopPropagation();
          selectScene(next);
          tabs[current].focus();
        });
      });
      function shuffle() {
        const delta = 1 + Math.floor(Math.random() * (scenes.length - 1));
        selectScene(current + delta);
      }
      document.getElementById('shuffleButton').addEventListener('click', shuffle);
      function setImmersive(on) {
        if (document.body.classList.contains('full-bleed') === on) return;
        document.body.classList.toggle('full-bleed', on);
        const trigger = document.getElementById('fullscreenButton');
        trigger.setAttribute('aria-pressed', String(on));
        trigger.setAttribute('aria-label', on ? '退出沉浸模式' : '进入沉浸模式');
        (on ? document.getElementById('exitFullscreenButton') : trigger).focus({preventScroll:true});
      }
      document.getElementById('fullscreenButton').addEventListener('click', () => setImmersive(!document.body.classList.contains('full-bleed')));
      document.getElementById('exitFullscreenButton').addEventListener('click', () => setImmersive(false));

      /* ---- 作品列表收起 ---- */
      const sceneMenu = document.getElementById('sceneMenu');
      const sceneMenuToggle = document.getElementById('sceneMenuToggle');
      sceneMenuToggle.addEventListener('click', () => {
        const collapsed = !sceneMenu.hidden;
        sceneMenu.hidden = collapsed;
        sceneMenuToggle.setAttribute('aria-expanded', String(!collapsed));
        sceneMenuToggle.textContent = collapsed ? '展开' : '收起';
        sceneMenuToggle.title = collapsed ? '展开作品列表' : '收起作品列表';
      });

      /* ---- 快捷键浮层 ---- */
      const shortcutsButton = document.getElementById('shortcutsButton');
      const shortcutPanel = document.getElementById('shortcutPanel');
      function setShortcuts(open) {
        shortcutPanel.hidden = !open;
        shortcutsButton.setAttribute('aria-expanded', String(open));
        shortcutsButton.classList.toggle('is-active', open);
      }
      shortcutsButton.addEventListener('click', () => setShortcuts(shortcutPanel.hidden));
      document.addEventListener('click', e => {
        if (shortcutPanel.hidden) return;
        if (shortcutPanel.contains(e.target) || shortcutsButton.contains(e.target)) return;
        setShortcuts(false);
      });

      /* ---- 材质与画面参数 ---- */
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const DEFAULTS = {
        depth: 65, blur: 33, grain: 47, grainSize: 50,
        light: 58, lightSize: 50, lightX: 72, lightY: 12,
        tint: 0, tintColor: '#d9c6ff', tintBlend: 'soft-light',
        scale: 100, vignette: 0,
        brightness: 100, contrast: 100, saturation: 100,
        follow: true
      };
      const PRESETS = {
        soft:     { depth: 42, blur: 82, grain: 64, grainSize: 80, light: 70, lightSize: 78, vignette: 14 },
        standard: { depth: 65, blur: 33, grain: 47, grainSize: 50, light: 58, lightSize: 50, vignette: 0 },
        sharp:    { depth: 92, blur: 2,  grain: 28, grainSize: 26, light: 46, lightSize: 30, vignette: 0 }
      };
      const SETTINGS_KEY = 'emboss-lab-settings';
      const settings = { ...DEFAULTS };

      // [key, sliderId, outputId, readout formatter, CSS value formatter]
      const SLIDERS = [
        ['depth', 'depthSlider', 'depthValue', n => n + '%', n => (n / 65).toFixed(3)],
        ['blur', 'blurSlider', 'blurValue', n => n + '%', n => (0.15 + n / 100 * 2.6).toFixed(2)],
        ['grain', 'grainSlider', 'grainValue', n => n + '%', n => (n / 100 * .8).toFixed(3)],
        ['grainSize', 'grainSizeSlider', 'grainSizeValue', n => Math.round(120 + n * 2.4) + 'px', n => Math.round(120 + n * 2.4) + 'px'],
        ['light', 'lightSlider', 'lightValue', n => n + '%', n => (n / 100 * .7).toFixed(3)],
        ['lightSize', 'lightSizeSlider', 'lightSizeValue', n => Math.round(120 + n * 4.6) + 'px', n => Math.round(120 + n * 4.6) + 'px'],
        ['lightX', 'lightXSlider', 'lightXValue', n => n + '%', n => n + '%'],
        ['lightY', 'lightYSlider', 'lightYValue', n => n + '%', n => n + '%'],
        ['tint', 'tintSlider', 'tintValue', n => n + '%', n => (n / 100).toFixed(3)],
        ['scale', 'scaleSlider', 'scaleValue', n => n + '%', n => (n / 100).toFixed(3)],
        ['vignette', 'vignetteSlider', 'vignetteValue', n => n + '%', n => (n / 100 * .92).toFixed(3)],
        ['brightness', 'brightnessSlider', 'brightnessValue', n => n + '%', n => n + '%'],
        ['contrast', 'contrastSlider', 'contrastValue', n => n + '%', n => n + '%'],
        ['saturation', 'saturationSlider', 'saturationValue', n => n + '%', n => n + '%']
      ];
      const sliderEl = {};
      const outputEl = {};
      for (const [key, sliderId, outputId] of SLIDERS) {
        sliderEl[key] = document.getElementById(sliderId);
        outputEl[key] = document.getElementById(outputId);
      }
      const followPointer = document.getElementById('followPointer');
      const manualLight = document.getElementById('manualLight');
      const tintColor = document.getElementById('tintColor');
      const tintBlend = document.getElementById('tintBlend');
      const presetButtons = [...document.querySelectorAll('.preset')];

      function paint() {
        poster.style.setProperty('--depth', settings.depth / 65);
        poster.style.setProperty('--blur', (0.15 + settings.blur / 100 * 2.6).toFixed(2));
        poster.style.setProperty('--grain-opacity', (settings.grain / 100 * .8).toFixed(3));
        poster.style.setProperty('--grain-size', Math.round(120 + settings.grainSize * 2.4) + 'px');
        poster.style.setProperty('--light-opacity', (settings.light / 100 * .7).toFixed(3));
        poster.style.setProperty('--light-size', Math.round(120 + settings.lightSize * 4.6) + 'px');
        poster.style.setProperty('--tint-color', settings.tintColor);
        poster.style.setProperty('--tint-opacity', (settings.tint / 100).toFixed(3));
        poster.style.setProperty('--tint-blend', settings.tintBlend);
        poster.style.setProperty('--scene-scale', settings.scale / 100);
        poster.style.setProperty('--vignette', (settings.vignette / 100 * .92).toFixed(3));
        poster.style.filter = `brightness(${settings.brightness}%) contrast(${settings.contrast}%) saturate(${settings.saturation}%)`;
        poster.classList.toggle('is-static-light', !settings.follow);
        manualLight.hidden = settings.follow;
        if (!settings.follow) applyLight(settings.lightX, settings.lightY);
        document.getElementById('lightHint').textContent = settings.follow ? '移动指针调整光照' : '光源位置已固定';
        tintColor.value = settings.tintColor;
        tintBlend.value = settings.tintBlend;
        followPointer.checked = settings.follow;
        presetButtons.forEach(b => b.classList.toggle('is-active', b.dataset.preset === activePreset));
        presetButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === activePreset)));
      }

      function syncControls() {
        for (const [key, , , readout] of SLIDERS) {
          const value = settings[key];
          sliderEl[key].value = value;
          outputEl[key].textContent = readout(value);
          sliderEl[key].style.setProperty('--track-progress', ((value - sliderEl[key].min) / (sliderEl[key].max - sliderEl[key].min) * 100).toFixed(2) + '%');
        }
      }

      let activePreset = 'standard';
      function applyPreset(name) {
        activePreset = name;
        Object.assign(settings, PRESETS[name]);
        syncControls();
        paint();
        saveSettings();
      }

      function matchesPreset(name) {
        return Object.entries(PRESETS[name]).every(([key, value]) => Number(settings[key]) === value);
      }

      function saveSettings() {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) {}
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
          if (saved && typeof saved === 'object') {
            for (const key of Object.keys(DEFAULTS)) {
              if (saved[key] !== undefined) settings[key] = saved[key];
            }
          }
        } catch (_) {}
        activePreset = Object.keys(PRESETS).find(matchesPreset) || 'custom';
      }

      function applyLight(x, y) {
        poster.style.setProperty('--mouse-x', Number(x).toFixed(2) + '%');
        poster.style.setProperty('--mouse-y', Number(y).toFixed(2) + '%');
      }

      for (const [key] of SLIDERS) {
        sliderEl[key].addEventListener('input', () => {
          settings[key] = Number(sliderEl[key].value);
          if (key === 'lightX' || key === 'lightY') {
            applyLight(settings.lightX, settings.lightY);
            settings.follow = false;
            followPointer.checked = false;
            poster.classList.add('is-static-light');
            manualLight.hidden = false;
          }
          activePreset = Object.keys(PRESETS).find(matchesPreset) || 'custom';
          const config = SLIDERS.find(item => item[0] === key);
          outputEl[key].textContent = config[3](settings[key]);
          sliderEl[key].style.setProperty('--track-progress', ((settings[key] - sliderEl[key].min) / (sliderEl[key].max - sliderEl[key].min) * 100).toFixed(2) + '%');
          paint();
          saveSettings();
        });
      }
      tintColor.addEventListener('input', () => {
        settings.tintColor = tintColor.value;
        if (settings.tint < 12) { settings.tint = 22; syncControls(); }
        paint();
        saveSettings();
      });
      tintBlend.addEventListener('change', () => {
        settings.tintBlend = tintBlend.value;
        paint();
        saveSettings();
      });
      followPointer.addEventListener('change', () => {
        settings.follow = followPointer.checked;
        paint();
        saveSettings();
      });
      presetButtons.forEach(button => button.addEventListener('click', () => applyPreset(button.dataset.preset)));
      document.getElementById('resetButton').addEventListener('click', () => {
        Object.assign(settings, DEFAULTS);
        activePreset = 'standard';
        syncControls();
        paint();
        saveSettings();
      });
      let pendingPointer = false;
      poster.addEventListener('pointermove', e => {
        if (!settings.follow) return;
        const bounds = poster.getBoundingClientRect();
        const x = (e.clientX - bounds.left) / bounds.width * 100;
        const y = (e.clientY - bounds.top) / bounds.height * 100;
        if (pendingPointer) return;
        pendingPointer = true;
        requestAnimationFrame(() => {
          applyLight(x, y);
          pendingPointer = false;
        });
      });
      poster.addEventListener('pointerleave', () => {
        if (settings.follow) applyLight(DEFAULTS.lightX, DEFAULTS.lightY);
      });

      document.addEventListener('keydown', e => {
        const t = e.target;
        if (e.key === 'Escape') { setImmersive(false); setShortcuts(false); return; }
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (t && typeof t.matches === 'function' && t.matches('input, textarea, select, [contenteditable], [role="tab"]')) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); selectScene(current + 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); selectScene(current - 1); }
        const key = e.key.toLowerCase();
        if (key === 'f') setImmersive(!document.body.classList.contains('full-bleed'));
        if (key === 'r') shuffle();
        if (key === 't') themeButton.click();
        if (key === '?') setShortcuts(shortcutPanel.hidden);
        if (/^[1-5]$/.test(e.key)) selectScene(Number(e.key) - 1);
      });

      /* ---- 复制链接 / 导出图片 ---- */
      const note = document.getElementById('actionNote');
      const NOTE_DEFAULT = note.textContent;
      let noteTimer;
      function flashNote(text) {
        note.textContent = text;
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => { note.textContent = NOTE_DEFAULT; }, 2400);
      }
      function shareUrl() {
        const params = new URLSearchParams();
        params.set('scene', current + 1);
        for (const key of Object.keys(DEFAULTS)) {
          if (settings[key] !== DEFAULTS[key]) params.set(key, String(settings[key]));
        }
        return location.href.split(/[?#]/)[0] + '?' + params.toString();
      }
      document.getElementById('copyLinkButton').addEventListener('click', async () => {
        const url = shareUrl();
        try {
          await navigator.clipboard.writeText(url);
          flashNote('已复制当前作品与参数的链接。');
        } catch (_) {
          history.replaceState(null, '', url);
          flashNote('链接已写入地址栏，可直接复制。');
        }
      });
      document.getElementById('exportButton').addEventListener('click', () => {
        const rect = poster.getBoundingClientRect();
        const scale = Math.min(2.5, 1600 / rect.width);
        const width = Math.round(rect.width * scale);
        const height = Math.round(rect.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        if (!ctx) { flashNote('当前浏览器不支持导出。'); return; }
        const activeScene = document.querySelector('.scene.is-active');
        const svg = activeScene && activeScene.querySelector('svg');
        flashNote('正在生成 PNG…');
        const done = () => {
          try {
            canvas.toBlob(blob => {
              if (!blob) { flashNote('导出失败，请稍后再试。'); return; }
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = 'emboss-lab-' + String(current + 1).padStart(2, '0') + '.png';
              link.click();
              setTimeout(() => URL.revokeObjectURL(link.href), 4000);
              flashNote('已导出 PNG（不含颗粒与光照图层）。');
            }, 'image/png');
          } catch (_) { flashNote('导出失败，请稍后再试。'); }
        };
        const paintBackdrop = () => {
          const grad = ctx.createLinearGradient(0, 0, width * .25, height);
          const scene = current;
          const stops = [
            ['#9290bd', '#8c84ae', '#77636e', '#4e3c30'],
            ['#76b48d', '#54976c', '#376c4a', '#152819'],
            ['#c5a9ed', '#b99be6', '#a582db', '#8b64c7'],
            ['#8e8e8e', '#777777', '#626262', '#626262'],
            ['#976ede', '#9660d5', '#8246c3', '#4c2082']
          ][scene] || ['#9290bd', '#8c84ae', '#77636e', '#4e3c30'];
          stops.forEach((color, i) => grad.addColorStop(i / (stops.length - 1), color));
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);
        };
        if (!svg) { paintBackdrop(); done(); return; }
        const clone = svg.cloneNode(true);
        clone.removeAttribute('class');
        clone.setAttribute('width', String(width));
        clone.setAttribute('height', String(height));
        const style = document.createElementNS(ns, 'style');
        const computed = getComputedStyle(poster);
        // Artwork-specific custom properties win over the page's :root defaults.
        for (const name of ['--ink', '--stroke', '--shadow', '--shine', '--depth', '--blur']) {
          clone.style.setProperty(name, computed.getPropertyValue(name).trim());
        }
        const cssText = [...document.styleSheets]
          .filter(sheet => !(sheet.href || '').includes('interface.css'))
          .flatMap(sheet => { try { return [...sheet.cssRules].map(r => r.cssText); } catch (_) { return []; } })
          .join('\n');
        style.textContent = cssText;
        clone.insertBefore(style, clone.firstChild);
        const svgText = new XMLSerializer().serializeToString(clone);
        const image = new Image();
        image.onload = () => { paintBackdrop(); ctx.drawImage(image, 0, 0, width, height); done(); };
        image.onerror = () => { paintBackdrop(); done(); };
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
      });

      /* ---- 从链接恢复作品与参数（优先于本地保存） ---- */
      let startScene = 0;
      function readUrlOverrides() {
        let params;
        try { params = new URLSearchParams(location.search); } catch (_) { return; }
        if (![...params.keys()].length) return;
        const scene = Number(params.get('scene'));
        if (scene >= 1 && scene <= 5) startScene = scene - 1;
        for (const key of Object.keys(DEFAULTS)) {
          const raw = params.get(key);
          if (raw === null) continue;
          if (key === 'follow') settings.follow = raw !== 'false';
          else if (key === 'tintColor') { if (/^#[0-9a-f]{6}$/i.test(raw)) settings[key] = raw; }
          else if (key === 'tintBlend') { if (['soft-light', 'overlay', 'multiply', 'screen'].includes(raw)) settings[key] = raw; }
          else if (!Number.isNaN(Number(raw))) {
            const input = sliderEl[key];
            settings[key] = clamp(Number(raw), Number(input.min), Number(input.max));
          }
        }
        activePreset = Object.keys(PRESETS).find(matchesPreset) || 'custom';
      }

      loadSettings();
      readUrlOverrides();
      syncControls();
      paint();
      applyLight(settings.lightX, settings.lightY);

      // The lettering is hand-built vector geometry, not a raster screenshot.
      const glyph = {
        A:'M2 56 V12 L12 2 H43 L53 12 V56 M2 30 H53',
        D:'M2 2 H42 L53 13 V45 L42 56 H2 Z',
        S:'M52 2 H12 L2 12 V22 L12 29 H43 L53 37 V46 L43 56 H2',
        T:'M0 2 H55 M28 2 V56',
        R:'M2 56 V2 H43 L53 12 V23 L43 32 H2 M35 32 L53 56',
        O:'M12 2 H43 L53 12 V45 L43 56 H12 L2 45 V12 Z',
        N:'M2 56 V2 H10 L44 56 H53 V2',
        U:'M2 2 V45 L12 56 H43 L53 45 V2'
      };
      const ns = 'http://www.w3.org/2000/svg';
      for (const id of ['heroWord','bigWord']) {
        const target = document.getElementById(id);
        let x = 0;
        for (const c of 'ADSTRONAUT') {
          const path = document.createElementNS(ns,'path');
          path.setAttribute('d',glyph[c]);
          path.setAttribute('transform',`translate(${x} 0)`);
          target.appendChild(path);
          x += 65;
        }
      }
      const hatch = document.getElementById('hatchLine');
      for (let x=100; x < 906; x+=7.1) {
        const line = document.createElementNS(ns,'path');
        line.setAttribute('d', `M${x.toFixed(1)} 731 l-6.5 24`);
        hatch.appendChild(line);
      }
      selectScene(startScene);
    })();
  </script>
</body>
</html>
